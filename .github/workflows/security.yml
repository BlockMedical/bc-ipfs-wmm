name: Security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bc-ipfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bc-ipfs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
